name: Flo
options:
  bundleIdPrefix: com.solderg
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  xcodeVersion: "26.0"
  groupSortPosition: top
  generateEmptyDirectories: true

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.0.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: 1
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  Flo:
    type: application
    platform: [iOS, macOS]
    sources:
      - path: Flo
        excludes:
          - "**/.DS_Store"
    dependencies:
      - package: Supabase
    settings:
      base:
        PRODUCT_NAME: Flo
        PRODUCT_BUNDLE_IDENTIFIER: com.solderg.flo
        INFOPLIST_KEY_CFBundleDisplayName: "Flō"
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.productivity"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: false
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: true
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ENABLE_HARDENED_RUNTIME: true
        ENABLE_APP_SANDBOX: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
        Release:
          SWIFT_COMPILATION_MODE: wholemodule
    entitlements:
      path: Flo/Flo.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true

  FloWidgets:
    type: app-extension
    platform: [iOS, macOS]
    sources:
      - path: FloWidgets
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_NAME: FloWidgets
        PRODUCT_BUNDLE_IDENTIFIER: com.solderg.flo.widgets
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_CFBundleDisplayName: "Flō Widgets"
        INFOPLIST_KEY_NSExtension_NSExtensionPointIdentifier: "com.apple.widgetkit-extension"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    entitlements:
      path: FloWidgets/FloWidgets.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - group.com.solderg.flo
